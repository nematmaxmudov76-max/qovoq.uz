[project]
name = "blog-api"
version = "1.0.0"
description = "Personal blog platform backend REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-slugify>=9.1.3",
    "redis>=8.1.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "starlette-admin>=1.0.2",
]

[tool.uv]
package = false
